name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: funban-verify
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Legacy Trendwatch compatibility tests require Node.js 24+.
          # The production image is still built and smoke-tested on Node.js 22.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:mcp
      - run: npm run test:trendwatch
      - run: docker compose -f docker-compose.yaml config --quiet
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker build -t funban:${{ github.sha }} .
      - name: Test Docker OpenRouter mode without external network
        run: >-
          docker run --rm --network none
          --mount type=bind,src="${{ github.workspace }}/tests",dst=/app/tests,readonly
          --env FUNBAN_TEST_BIND_HOST=0.0.0.0
          funban:${{ github.sha }}
          node --test tests/trendwatch-config.test.mjs tests/openrouter-server.test.mjs tests/openrouter-clarifier.test.mjs
      - name: Smoke-test production image
        run: |
          container_id=$(docker run --detach funban:${{ github.sha }})
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..15}; do
            if docker exec "$container_id" node -e \
              "fetch('http://127.0.0.1:3000/api/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
            then
              docker exec "$container_id" node --input-type=module -e \
                "for (const [path, expected] of [['/',302],['/api/state',401],['/api/attachments/test',401]]) { const r = await fetch('http://127.0.0.1:3000'+path,{redirect:'manual'}); if(r.status!==expected) process.exit(1); }"
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_id"
          exit 1

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Coolify deployment
        run: >
          curl --fail-with-body --retry 3 --retry-all-errors
          --request POST "${{ secrets.COOLIFY_WEBHOOK }}"
          --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
